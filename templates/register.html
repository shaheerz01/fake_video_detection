<!DOCTYPE html>
<html>
<head>
    <title>Register - Fake Video Detector</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="register-page">

<div class="auth-box mt-5">

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, msg in messages %}
                <div class="alert alert-{{ category }} text-center">{{ msg }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <h2>Create Account</h2>

    <form method="POST">

        <input type="text" name="username" placeholder="Choose username" required>

        <!-- PASSWORD WITH EYE ICON -->
        <div class="password-wrapper">
            <input
                type="password"
                id="regPassword"
                name="password"
                placeholder="Choose password"
                required
            >
            <i class="bi bi-eye-slash" id="toggleRegPassword"></i>
        </div>

        <button type="submit">Register</button>
    </form>

    <a href="/login">Already have an account?</a>
</div>

<!-- SHOW / HIDE PASSWORD SCRIPT -->
<script>
    const toggle = document.getElementById("toggleRegPassword");
    const password = document.getElementById("regPassword");

    toggle.addEventListener("click", () => {
        const isHidden = password.type === "password";
        password.type = isHidden ? "text" : "password";
        toggle.classList.toggle("bi-eye");
        toggle.classList.toggle("bi-eye-slash");
    });
</script>

</body>
</html>
